reported_only:
  scp_detr:
    reason: "The linked repository contains no runnable implementation at the pinned revision."
    repository: https://github.com/Yttong-rr/SCPDETR
    commit: b7c708d47aca4eb20c78ad903f989cdea5f006b0
  lsdm_pcb:
    reason: "No official runnable implementation was found; use paper-reported numbers only in a separate table."
  pcb_mmf:
    reason: "No verified official training repository; cite as a 2026 domain method without mixing its split-specific values."
    paper: https://doi.org/10.1038/s41598-026-49734-2
  pcb_fs:
    reason: "No verified official training repository; reported values use a different protocol."
    paper: https://doi.org/10.3390/sym17122020
  structure_guided_pretraining:
    reason: "2026 arXiv result without a verified runnable release at audit time."
    paper: https://arxiv.org/abs/2606.03508
  unipcb_generation_assisted:
    reason: "Uses generated data and a different 2,027-image construction, so its values are not directly rankable."
    paper: https://arxiv.org/abs/2605.04635

deferred_runnable:
  rtdetrv4_m:
    reason: "Official training requires a DINOv3 teacher repository and weights; run only on an adequate isolated environment."
    repository: https://github.com/RT-DETRs/RT-DETRv4.git
    commit: 55fefaaed7efe2a5f72d0a18fd4e05965e35c292
    config: configs/rtv4/rtv4_hgnetv2_m_coco.yml
  deimv2:
    reason: "Current 2026 comparator; deferred until its DINOv3 environment and memory budget are available."
    repository: https://github.com/Intellindust-AI-Lab/DEIMv2.git
    commit: add5bcdb499bf7b8a366bfeac1a47d3dc278de27
