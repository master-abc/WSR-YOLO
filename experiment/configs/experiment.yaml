# ============================================================
# DWGSA-YOLO 实验统一配置文件
# 所有实验参数集中管理，运行脚本直接读取此文件，无需命令行参数
# ============================================================

# ------------------------------------------------------------
# 运行模式: full（完整训练）或 smoke（快速验证，2 epochs）
# ------------------------------------------------------------
mode: full    # full | smoke

# ------------------------------------------------------------
# 全局训练超参数
# ------------------------------------------------------------
train:
  epochs: 300
  batch: 16
  imgsz: 640
  optimizer: SGD
  lr0: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  cos_lr: true
  amp: true
  mosaic: 1.0
  mixup: 0.1
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  flipud: 0.0
  fliplr: 0.5
  seed: 42
  workers: 4
  plots: true

# ------------------------------------------------------------
# 硬件配置
# device 为 GPU 编号列表，实验按列表顺序轮询分配
# 示例:
#   [0]       — 所有实验用卡0
#   [0, 1]    — 实验交替使用卡0和卡1
#   [0, 1, 2] — 三卡轮询
# ------------------------------------------------------------
hardware:
  device: [0]

# ------------------------------------------------------------
# 数据集路径 (相对于 experiment/configs/ 目录)
# ------------------------------------------------------------
datasets:
  deeppcb: deeppcb.yaml
  pku_pcb: pku_pcb.yaml
  defectdet: defectdet.yaml

# ============================================================
# Exp1: SOTA 对比实验
# 数据集: DeepPCB (6类, 1500张)
# ============================================================
exp1:
  data: deeppcb
  output_dir: exp1
  methods:
    - name: yolo11m_baseline
      config: yolo11m_baseline.yaml
      desc: "YOLO11m (C2PSA)"

    - name: yolo11m_cbam
      config: yolo11m_cbam.yaml
      desc: "YOLO11m + CBAM"

    - name: yolo11m_ema
      config: yolo11m_ema.yaml
      desc: "YOLO11m + EMA"

    - name: yolo11m_simam
      config: yolo11m_simam.yaml
      desc: "YOLO11m + SimAM"

    - name: yolo11m_coordatt
      config: yolo11m_coordatt.yaml
      desc: "YOLO11m + CoordAtt"

    - name: fdsa_yolo11m
      config: fdsa_yolo11m.yaml
      desc: "YOLO11m + FDSA"

    - name: dwgsa_yolo11m
      config: dwgsa_yolo11m.yaml
      desc: "DWGSA-YOLO (Ours)"

# ============================================================
# Exp2: 消融实验
# 数据集: DeepPCB (6类, 1500张)
# ============================================================
exp2:
  data: deeppcb
  output_dir: exp2
  variants:
    - name: baseline_c2psa
      config: yolo11m_baseline.yaml
      desc: "Baseline (C2PSA)"
      component: baseline

    - name: wave_only
      config: dwgsa_wave_only.yaml
      desc: "+ Wavelet Branch Only"
      component: wavelet

    - name: sparse_only
      config: dwgsa_sparse_only.yaml
      desc: "+ Sparse Attn Only"
      component: sparse

    - name: no_geo_prior
      config: dwgsa_no_geo_prior.yaml
      desc: "+ DWGSA w/o GeoPrior"
      component: geo_prior

    - name: no_adaptive
      config: dwgsa_no_adaptive.yaml
      desc: "+ DWGSA w/o Adaptive"
      component: adaptive

    - name: single_level
      config: dwgsa_single_level.yaml
      desc: "+ DWGSA 1-Level DWT"
      component: multi_level

    - name: dwgsa_full
      config: dwgsa_yolo11m.yaml
      desc: "DWGSA-YOLO (Full)"
      component: full

# ============================================================
# Exp3: 跨数据集泛化实验
# 数据集: DefectDet (5类, 268张) + PKU_PCB (6类, 693张)
# 验证模型在不同来源数据集上的泛化能力
# 注意: 各数据集独立训练和测试，验证的是方法通用性而非迁移能力
# 所有图片训练时统一resize到640×640
# ============================================================
exp3:
  output_dir: exp3
  experiments:
    - name: defectdet_baseline
      config: yolo11m_baseline_defectdet.yaml
      desc: "Baseline on DefectDet"
      data: defectdet
      nc: 5

    - name: defectdet_dwgsa
      config: dwgsa_yolo11m_defectdet.yaml
      desc: "DWGSA-YOLO on DefectDet"
      data: defectdet
      nc: 5

    - name: pku_pcb_baseline
      config: yolo11m_baseline_pku.yaml
      desc: "Baseline on PKU_PCB"
      data: pku_pcb
      nc: 6

    - name: pku_pcb_dwgsa
      config: dwgsa_yolo11m_pku.yaml
      desc: "DWGSA-YOLO on PKU_PCB"
      data: pku_pcb
      nc: 6

# ============================================================
# Exp4: 可视化与可解释性分析
# 需要 exp1 训练完成后的权重文件
# ============================================================
exp4:
  output_dir: exp4/figures
  baseline_config: yolo11m_baseline.yaml
  dwgsa_config: dwgsa_yolo11m.yaml
  # 训练完成后填入权重路径，留空则使用未训练模型（仅验证结构）
  baseline_weights: ""
  dwgsa_weights: ""

# ============================================================
# Exp5: 噪声鲁棒性实验
# 数据集: DeepPCB (6类, 1500张)
# 策略: 在clean数据上训练（2次），在5个噪声水平测试集上评估
# 验证小波变换的抗噪能力
# ============================================================
exp5:
  data: deeppcb
  output_dir: exp5
  # 噪声水平定义（基于真实PCB图像分析）
  noise_levels:
    clean:
      sigma: 0
      desc: "Clean (No Noise)"
    low:
      sigma: 3
      desc: "Low Noise (σ=3, Realistic)"
    medium:
      sigma: 6
      desc: "Medium Noise (σ=6, 2x)"
    high:
      sigma: 9
      desc: "High Noise (σ=9, 3x)"
    very_high:
      sigma: 15
      desc: "Very High Noise (σ=15, 5x)"
  # 测试的方法
  methods:
    - name: yolo11m_baseline
      config: yolo11m_baseline.yaml
      desc: "YOLO11m Baseline"
    - name: dwgsa_yolo11m
      config: dwgsa_yolo11m.yaml
      desc: "DWGSA-YOLO (Ours)"
